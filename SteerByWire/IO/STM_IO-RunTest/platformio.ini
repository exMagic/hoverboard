[env:genericSTM32F103RC]
platform = ststm32
board = genericSTM32F103RC
framework = arduino

; Configuration for STM32F103RC (hoverboard MCU)
board_build.mcu = stm32f103rct6
board_build.f_cpu = 72000000L

; Upload protocol
upload_protocol = stlink

; Debug configuration
debug_tool = stlink

; Monitor configuration
monitor_speed = 115200
monitor_port = COM3

; Build optimization flags - zbalansowane dla SimpleFOC
build_flags = 
    -Os                          ; Optimize for size
    -ffunction-sections          ; Place each function in separate section
    -fdata-sections             ; Place each data in separate section
    -Wl,--gc-sections           ; Remove unused sections
    -fno-exceptions             ; Disable C++ exceptions  
    -DNDEBUG                    ; Disable debug assertions
    -fno-stack-protector        ; Disable stack protection
    -DSIMPLEFOC_STM32_DEBUG     ; Enable SimpleFOC STM32 optimizations
    
; Remove problematic flags
build_unflags = 
    -O2
    -Og

; Library dependencies
lib_deps = 
    askuric/Simple FOC@^2.3.4

; Source filter (if you want to exclude specific files)
; src_filter = +<*> -<.git/> -<.svn/>
