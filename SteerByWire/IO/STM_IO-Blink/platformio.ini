[env:genericSTM32F103RC]
platform = ststm32
board = genericSTM32F103RC
framework = arduino

; Configuration for STM32F103RC (hoverboard MCU)
board_build.mcu = stm32f103rct6
board_build.f_cpu = 72000000L

; Upload protocol
upload_protocol = stlink

; Debug configuration
debug_tool = stlink

; Monitor configuration
monitor_speed = 115200
monitor_port = COM3

; Library dependencies
lib_deps = 
    ; Add libraries here if needed

; Source filter (if you want to exclude specific files)
; src_filter = +<*> -<.git/> -<.svn/>
